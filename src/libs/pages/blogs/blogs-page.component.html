<section class="block">
  <div class="wrap">
    <div class="head">
      <h2>Blogs</h2>
    </div>
    <div class="blog-list">
      <article class="blog-card" *ngFor="let article of articles">
        <div class="blog-card-copy">
          <p class="label">Stella Space · Home &amp; living</p>
          <h3><a [routerLink]="['/home/blogs', article.slug]">{{ article.title }}</a></h3>
          <p>{{ article.excerpt }}</p>
          <a class="read-link" [routerLink]="['/home/blogs', article.slug]" [attr.aria-label]="'Read ' + article.title">Read article <span aria-hidden="true">→</span></a>
        </div>
      </article>
    </div>
  </div>
</section>
